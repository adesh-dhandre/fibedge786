name: FibEdge Market Refresh (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
      - run: python fib_price_refresh_v2.py
      - run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"
          git add -f FIBEDGE_LATEST_SIGNALS.csv
          if ! git diff --cached --quiet; then
            git commit -m "Manual FibEdge market refresh"
            git pull --rebase
            git push
          fi
