name: FibEdge Market Refresh

on:
  workflow_dispatch:

  schedule:
    # NSE 09:15 IST
    - cron: "45 3 * * 1-5"

    # Every 15 minutes from 09:30 IST to 15:15 IST
    - cron: "0,15,30,45 4-9 * * 1-5"

    # NSE 15:30 IST
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Refresh FibEdge prices
        run: |
          python fib_price_refresh_v2.py

      - name: Commit latest signals
        run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"

          git add -f FIBEDGE_LATEST_SIGNALS.csv

          if git diff --cached --quiet; then
            echo "No market-data changes."
          else
            git commit -m "Auto refresh FibEdge market data"
            git push
          fi
