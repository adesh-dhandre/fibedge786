name: FibEdge Quality Refresh

on:
  workflow_dispatch:

  schedule:
    # 09:15 AM IST
    - cron: "45 3 * * 1-5"

    # 09:30 AM to 03:15 PM IST, every 15 minutes
    - cron: "0,15,30,45 4-9 * * 1-5"

    # Final 03:30 PM IST update
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fibedge-quality-refresh
  cancel-in-progress: false

jobs:
  refresh-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Refresh latest prices
        run: |
          python fib_price_refresh_v2.py

      - name: Build quality setups
        run: |
          python fibedge_quality_live_merge.py

      - name: Build opportunity ranking
        run: |
          python fibedge_opportunity_rank_v3.py

      - name: Commit refreshed data
        run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"

          git add -f FIBEDGE_LATEST_SIGNALS.csv
          git add -f FIBEDGE_TOP_CURRENT_SETUPS.csv
          git add -f FIBEDGE_BEST_OPPORTUNITIES_V3.csv

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto refresh FibEdge quality data"
            git pull --rebase origin master
            git push origin master
          fi
