name: Strategy 05 Daily Confirmation Refresh

on:
  workflow_dispatch:

  schedule:
    # ONE automatic scan only: 16:05 IST (10:35 UTC), Monday-Friday.
    # NSE closes at 15:30 IST; this gives the daily candle time to settle.
    - cron: "35 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: strategy-05-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Strategy 05 research branch
        uses: actions/checkout@v4
        with:
          ref: strategy-05-many-trades
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Scan Strategy 05 completed daily candles
        run: |
          python strategy_05_live/strategy_05_scanner.py

      - name: Publish research feed
        run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"

          git add -f strategy_05_live/data/strategy_05_candidates.json
          git add -f strategy_05_live/data/strategy_05_failed_symbols.csv

          if git diff --cached --quiet; then
            echo "No Strategy 05 data changes."
          else
            git commit -m "Refresh Strategy 05 completed-candle data"
            git pull --rebase origin strategy-05-many-trades
            git push origin HEAD:strategy-05-many-trades
          fi
