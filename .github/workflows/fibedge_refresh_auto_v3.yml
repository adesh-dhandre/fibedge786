name: FibEdge Auto Refresh V3

on:
  workflow_dispatch:

  schedule:
    # 09:15, 09:30, 09:45 AM IST
    - cron: "15,30,45 9 * * 1-5"
      timezone: "Asia/Kolkata"

    # Every 15 minutes from 10:00 AM to 02:45 PM IST
    - cron: "0,15,30,45 10-14 * * 1-5"
      timezone: "Asia/Kolkata"

    # 03:00, 03:15, 03:30 PM IST
    - cron: "0,15,30 15 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: fibedge-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Refresh FibEdge market prices
        run: |
          python fib_price_refresh_v2.py

      - name: Publish latest signals
        run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"

          git add -f FIBEDGE_LATEST_SIGNALS.csv

          if git diff --cached --quiet; then
            echo "No market-data changes."
          else
            git commit -m "Auto refresh FibEdge market data"
            git pull --rebase origin master
            git push origin master
          fi
