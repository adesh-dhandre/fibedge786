name: FibEdge Automatic Market Refresh

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    # 09:15 IST
    - cron: "45 3 * * 1-5"

    # 09:30, 09:45 IST
    - cron: "0,15 4 * * 1-5"

    # Every 15 minutes from 10:00 AM through 2:45 PM IST
    - cron: "30,45,0,15 4-9 * * 1-5"

    # 3:00, 3:15, 3:30 PM IST
    - cron: "30,45 9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Refresh FibEdge market data
        run: |
          python fib_price_refresh_v2.py

      - name: Publish latest signals
        run: |
          git config user.name "FibEdge Bot"
          git config user.email "fibedge-bot@users.noreply.github.com"

          git add -f FIBEDGE_LATEST_SIGNALS.csv

          if git diff --cached --quiet; then
            echo "No market-data changes."
          else
            git commit -m "Auto refresh FibEdge market data"
            git pull --rebase origin master
            git push origin master
          fi
